# One-command dev stack: Postgres + API.
#
#   docker compose up --build
#
# The API applies its embedded migrations on startup (see cmd/server/main.go
# → migrations.Apply), so a fresh volume is migrated the moment the API boots
# and new migrations apply on the next `up` with no volume wipe needed.
#
# Note: if you've been running a standalone `ranke-postgres` container
# from the earlier `docker run` instructions, stop it first:
#
#   docker rm -f ranke-postgres
#
# This compose file owns port 5432.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ranke-postgres
    environment:
      POSTGRES_USER: ranke
      POSTGRES_PASSWORD: ranke
      POSTGRES_DB: ranke
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranke -d ranke"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ranke-api
    environment:
      # Override the .env file's localhost DATABASE_URL — inside the
      # compose network Postgres is reachable as `postgres`, not the
      # host loopback.
      DATABASE_URL: postgres://ranke:ranke@postgres:5432/ranke?sslmode=disable
      PORT: "8080"
      ENV: development
    # Inherit JWT_SECRET, APPLE_BUNDLE_ID, etc. from the dev .env so
    # we don't bake secrets into the image.
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # Restart on failure during dev so a typo in code doesn't leave
    # you with a dead container.
    restart: unless-stopped

volumes:
  postgres_data:
